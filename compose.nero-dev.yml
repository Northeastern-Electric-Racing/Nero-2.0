name: nero-2

services:
  siren-dev:
    container_name: nero-siren-dev
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./dev-config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  calypso-mock:
    container_name: nero-calypso-mock
    image: ghcr.io/northeastern-electric-racing/calypso:Develop
    depends_on:
      - siren-dev
    environment:
      - CALYPSO_SIREN_HOST_URL=siren-dev:1883
    command:
      - "simulate"
      - "--disable-topic"
      - ".*Fault.*"
      # The dev-vcu service owns navigation and car state
      - "--disable-topic"
      - "VCU/CarState/(nero_index|home_mode|functional_state)"
      - "--disable-topic"
      - "Wheel/Buttons/.*"

  dev-vcu:
    container_name: nero-dev-vcu
    image: node:22-alpine
    depends_on:
      - siren-dev
    environment:
      - MQTT_URL=mqtt://siren-dev:1883
    volumes:
      - ./dev-config/dev-vcu.mjs:/app/dev-vcu.mjs:ro
    working_dir: /app
    command: sh -c "npm install --silent --no-save mqtt@5 && node dev-vcu.mjs"
