name: nero-2

services:
  siren-dev:
    container_name: nero-siren-dev
    image: eclipse/zenoh:latest
    ports:
      - "7447:7447"
      # The REST plugin, which playwright/mock.mjs reads samples through
      - "8000:8000"
    volumes:
      - ./dev-config/zenoh-router.json5:/etc/zenoh/zenohd.json5:ro
    command: ["-c", "/etc/zenoh/zenohd.json5"]

  calypso-mock:
    container_name: nero-calypso-mock
    # Lowercase: the capitalised Develop tag is a stale pre-Zenoh build
    image: ghcr.io/northeastern-electric-racing/calypso:develop
    depends_on:
      - siren-dev
    environment:
      - CALYPSO_ZENOH=true
      - CALYPSO_ZENOH_CONF=/etc/zenoh/calypso.json5
    volumes:
      - ./dev-config/zenoh-calypso.json5:/etc/zenoh/calypso.json5:ro
    command:
      - "simulate"
      - "--disable-topic"
      - ".*Fault.*"
      - "--disable-topic"
      - "Wheel/Buttons/.*|VCU/CarState/(nero_index|home_mode)"
