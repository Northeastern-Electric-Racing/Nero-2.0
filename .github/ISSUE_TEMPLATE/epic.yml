name: Epic
description: A settled idea, broken into dev work tickets.
type: Feature
labels: [epic]
body:
  - type: markdown
    attributes:
      value: |
        An epic is a finished idea: the approach is decided. Link its dev work tickets as sub-issues.
        If the idea came through spikes, link the idea below and close it as completed.
        After filing, add a written-by label (`by: human`, `by: ai`, `by: ai-assisted`) and area labels (`view`, `controller`, `model`, `devops`).
  - type: input
    id: from-idea
    attributes:
      label: From idea
      description: The idea issue this epic came from, if any.
      placeholder: "#123"
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this delivers, and for whom, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: The chosen approach, and the spike or decision it came from.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Diagram
      description: Illustrate the change, ideally before and after. Mermaid (in a mermaid code block), ASCII, or an uploaded image.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this epic deliberately does not cover.
      value: "- "
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What must be true for the epic to be done. Checkboxes.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: context-transfer
    attributes:
      label: Context transfer
      description: Optional. A dump of context for whoever picks this up (person or agent). Start with a short summary, then the raw context.
      value: |
        SUMMARY

        CONTEXT
      render: text
