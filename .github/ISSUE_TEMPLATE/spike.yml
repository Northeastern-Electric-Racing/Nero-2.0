name: Spike
description: Explore one approach to an idea, or try a small standalone improvement. Draft PRs welcome.
type: Task
labels: [spike]
body:
  - type: markdown
    attributes:
      value: |
        A spike lays out what to explore and what we expect. It does **not** hold answers: post findings as comments and link draft PRs.
        Under an idea, each spike is usually a separate implementation of it; add it as a sub-issue of the idea. A small improvement can be a standalone spike.
        After filing, add a written-by label (`by: human`, `by: ai`, `by: ai-assisted`) and area labels (`view`, `controller`, `model`, `devops`).
  - type: textarea
    id: exploring
    attributes:
      label: Exploring
      description: The approach or implementation being explored, broadly. Say what it is, not how the exploration will be run.
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What we expect this approach to prove, in one or two sentences. Reviewers judge the draft PRs and findings against it.
    validations:
      required: true
  - type: textarea
    id: context-transfer
    attributes:
      label: Context transfer
      description: Optional. A dump of context for whoever picks this up (person or agent). Start with a short summary, then the raw context.
      value: |
        SUMMARY

        CONTEXT
      render: text
